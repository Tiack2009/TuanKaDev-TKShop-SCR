# ─────────────────────────────────────────────────────────────────
#  TkShop — danh muc & vat pham
#
#  Moi item gom:
#    title                     : tieu de man hinh xac nhan mua
#    material                  : Bukkit material
#    custom-displayname-enabled: co dung ten rieng khong
#    custom-displayname        : ten rieng (neu bat o tren)
#    execute-command           : true = chay lenh thay vi dua item thang vao tui
#    command                   : danh sach lenh console (ho tro {player}, {amount})
#    enchantments              : danh sach "TEN_PHU_PHEP:CAP_DO" (vd: DURABILITY:3)
#    amount                    : so luong item nhan duoc / lenh chay ung voi 1 don vi gia
#    max-amount                : so luong toi da co the mua trong 1 lan
#    price                     : gia cho "amount" don vi
#    slot                      : vi tri trong GUI danh muc
#    economy                   : "vault" (tien $) hoac "tkshards" (tien TKShards)
# ─────────────────────────────────────────────────────────────────

items-lore:
  - '&fGia mua: &a${price}'

